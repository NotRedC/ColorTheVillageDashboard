<h2 class="section-title">Tasks</h2>

<button mat-flat-button color="primary" (click)="createTask()">+ Create Task</button>


  <mat-table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2 zebra-table">

    <!-- Task Name Column -->
    <ng-container matColumnDef="taskName">
      <mat-header-cell *matHeaderCellDef mat-sort-header=""> Task Name </mat-header-cell>
      <mat-cell *matCellDef="let task"> {{ task.taskName }} </mat-cell>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
      <mat-cell *matCellDef="let task"> 
        <button mat-icon-button color="primary" (click)="editTask(task)" matTooltip="Edit Task">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteTask(task)" matTooltip="Delete Task">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

  </mat-table>
