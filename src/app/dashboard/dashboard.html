<div class="dashboard-grid">
  <!-- Ongoing Events -->
  <mat-card class="dashboard-card">
    <button mat-mini-fab color="primary" (click)="createEvent()">
        <mat-icon>add</mat-icon>
      </button>
    <div class="dashboard-card-content">
      <div>
        <h2>ongoingEvents</h2>
        <p>Ongoing Events</p>
      </div>
    </div>
  </mat-card>

  <!-- Total Donations -->
  <mat-card class="dashboard-card">
    <div class="dashboard-card-content">
      <h2>totalDonations | currency</h2>
      <p>Total Donations</p>
    </div>
  </mat-card>

  <!-- Confirmed Volunteers -->
  <mat-card class="dashboard-card">
    <div class="dashboard-card-content">
      <h2>totalConfirmedVolunteers</h2>
      <p>Confirmed Volunteers</p>
    </div>
  </mat-card>

  <!-- Regular Volunteers -->
  <mat-card class="dashboard-card">
    <div class="dashboard-card-content">
      <h2>totalRegularVolunteers</h2>
      <p>Regular Volunteers</p>
    </div>
  </mat-card>
</div>
