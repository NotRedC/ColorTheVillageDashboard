<h2>Donations History</h2>

   <div class="controls-bar"> 

            <button mat-raised-button color="primary" (click)="exportToCSV()">
                Download CSV
            </button>
    </div>


<mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2 zebra-table">

  <ng-container matColumnDef="donorName">
    <mat-header-cell *matHeaderCellDef mat-sort-header> Donor </mat-header-cell>
    <mat-cell *matCellDef="let donation"> {{ donation.donorName }} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="amount">
    <mat-header-cell *matHeaderCellDef mat-sort-header> Amount </mat-header-cell>
    <mat-cell *matCellDef="let donation">
      {{ donation.amount }}
    </mat-cell>
  </ng-container>

  <ng-container matColumnDef="currency">
    <mat-header-cell *matHeaderCellDef mat-sort-header> Currency </mat-header-cell>
    <mat-cell *matCellDef="let donation"> {{ donation.currency }} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="date">
    <mat-header-cell *matHeaderCellDef mat-sort-header> Date </mat-header-cell>
    <mat-cell *matCellDef="let donation"> {{ donation.date }} </mat-cell>
  </ng-container>

  <ng-container matColumnDef="status">
    <mat-header-cell *matHeaderCellDef mat-sort-header> Status </mat-header-cell>
    <mat-cell *matCellDef="let donation"> {{ donation.status }} </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>
