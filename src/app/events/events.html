<h2 class="section-title">Ongoing Events</h2>

<div class="table-header">
  <button mat-flat-button color="primary">+ Create Event</button>
  <button mat-button>View History</button>
</div>

<mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2 full-width-table zebra-table">

  <!-- Event Name -->
  <ng-container matColumnDef="name">
    <mat-header-cell *matHeaderCellDef mat-sort-header> Title </mat-header-cell>
    <mat-cell *matCellDef="let event"> {{ event.title }} </mat-cell>
  </ng-container>

  <!-- Location -->

  <!-- Start Date -->
  <ng-container matColumnDef="startDate">
    <mat-header-cell *matHeaderCellDef mat-sort-header> Start Date </mat-header-cell>
    <mat-cell *matCellDef="let event"> {{ event.startDate }} </mat-cell>
  </ng-container>

  <!-- End Date -->
  <ng-container matColumnDef="endDate">
    <mat-header-cell *matHeaderCellDef mat-sort-header> End Date </mat-header-cell>
    <mat-cell *matCellDef="let event"> {{ event.endDate }} </mat-cell>
  </ng-container>

  <!-- Confirmed Volunteers -->
  <ng-container matColumnDef="confirmedVolunteers">
    <mat-header-cell *matHeaderCellDef mat-sort-header>Total Volunteers </mat-header-cell>
    <mat-cell #volunteersCell *matCellDef="let event"> 
    {{ event.confirmedVolunteers.length }} 
    </mat-cell>
  </ng-container>

  <!-- Actions -->
  <ng-container matColumnDef="actions">
    <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
    <mat-cell *matCellDef="let event">
      <button mat-icon-button color="primary" matTooltip="Edit Event">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="accent" matTooltip="Archive Event">
        <mat-icon>archive</mat-icon>
      </button>
    </mat-cell>
  </ng-container>

  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>
