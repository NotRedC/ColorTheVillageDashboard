<h2 mat-dialog-title>Archived Events</h2>

<div mat-dialog-content>
  <mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2, zebra-table">
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Event Name </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.name }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="location">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Location </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.location }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="startDate">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Start Date </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.startDate | date }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="endDate">
      <mat-header-cell *matHeaderCellDef mat-sort-header> End Date </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.endDate | date }} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="confirmedVolunteers">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Volunteers </mat-header-cell>
      <mat-cell *matCellDef="let element"> {{ element.confirmedVolunteers.length }} </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Close</button>
</div>
